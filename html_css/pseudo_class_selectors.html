<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    li:first-child {
        color: red;
        background-color: yellow;
        border: 2px solid black;
    } 
     li:nth-child(2) {
        color: blue;
        background-color: lightblue;
        border: 2px solid black;
    }
     li:nth-child(3) {
        color: rgb(7, 7, 5);
        background-color: lightcoral;
        border: 2px solid black;
        
    }
     li:nth-child(4) {
        color: purple;
        background-color: plum;
        border: 2px solid black;
    }
        li:nth-child(5) {
        color: rgb(249, 6, 233);
        background-color: black;
        border: 2px solid black;
    }
    li:nth-child(6) {
        color: rgb(207, 25, 25);
        background-color: rgb(36, 179, 223);
        border: 2px solid black;
    }
        button:first-child {
            color: rgb(214, 202, 202);
            background-color: green;
            border: 2px solid black;
        }
        button:nth-child(2) {
            color: white;
            background-color: blue;
            border: 2px solid black;
        }
        button:nth-child(3) {
            color: white;
            background-color: orange;
            border: 2px solid black;
        }
        button:nth-child(4) {
            color: white;
            background-color: red;
            border: 2px solid black;
        }
        button:nth-child(5) {
            color: white;
            background-color: gray;
            border: 2px solid black;
    } 
    ol{
        background-color: lightgray;
        border: 2px solid black;
        opacity: 0.8;

    }  
    input:focus {
        background-color: rgb(132, 132, 47);
        border: 2px solid rgb(167, 16, 16);
    }
     a:hover {
        color: rgb(155, 85, 85);
        background-color: rgb(92, 46, 46);
        border: 2px solid black;
    }
     
    </style>
</head>
<body>
    <input type="search" placeholder="Enter your name" align="center">
    <a href="https://www.office.com/" target="_blank" align="center">Microsoft office</a>
    <iframe src="https://tse1.mm.bing.net/th/id/OIP.qQTmiwO14yYGygj_m6UVgwHaEK?rs=1&pid=ImgDetMain&o=7&rm=  width="475" height="267"></iframe>
    <h1> ordered list</h1>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
      </style>
    </ol>
    <h2>unordered list</h2>
    <div>
        <button>Click me</button>
        <button>enter</button>
        <button>submit</button>
        <button>reset</button>
        <button>cancel</button>

    </div>
</body>
</html>
