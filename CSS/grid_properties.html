<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .container {
            border: 2px solid black;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 400px;
            padding: 10px;
            border: 1px solid black;
        }
        #button-container{
            margin-top: 30px;
            display:grid;
            grid-template-columns: auto auto auto auto;
            row-gap: 10px;
            column-gap: 10px;
        }

        #button-container div {
            border: 2px solid red;
            text-align: center;
            padding:10px;
            border-radius: 8px;
        }
        #button-container div{
            border: 2px solid red;
            text-align: center;
            padding:10px;
            border-radius: 8px;
        }
        #button-container div:nth-child(1){
            background-color: aqua;
            color: black;
            font-weight: bold;
        }
        #button-container div:nth-child(2){
            background-color:aquamarine;
            color: black;
            font-weight: bold;
        }
        #button-container div:nth-child(3){
            background-color:blueviolet;
            color: black;
            font-weight: bold;
        }
        #button-container div:nth-child(4){

            font-weight: bold;
        }

            color: black;
            font-weight: bold;
        }
        #button-container div:nth-child(6){

        }

        }
        #button-container div:nth-child(9){
            background-color:cornflowerblue;
            color: black;
            font-weight: bold;
        }
        #button-container div:nth-child(10){
            background-color:crimson;
            color: black;
            font-weight: bold;
        }
        #button-container div:nth-child(11){
            background-color:cyan;
            color: black;
            font-weight: bold;
        }
        #button-container div:nth-child(12){
            background-color:darkblue;

        }

        }

            background-color:darkgreen;
            color: black;
            font-weight: bold;
            grid-row-start: 4;
            grid-column-start: 4;
            grid-row-end: 6;
        }
        #button-container div:nth-child(17){
            background-color:darkkhaki;
            color: black;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <div class="container">
        <div>
            <input type="number" readonly placeholder="0">
        </div>
        <div id="button-container">
            <div>sin</div>
