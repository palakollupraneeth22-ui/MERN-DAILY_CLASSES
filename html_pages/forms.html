<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form align="center" style="background-image: url(https://th.bing.com/th/id/OIP.ANNjdRsnAba-BOc9VEaUPwHaE8?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3); width: 300px; margin: auto;">
        <fieldset style="width: 300px; margin: auto;">
            <legend align="center">Login Form</legend>
            <label for="NAME">USERNAME:</label>
            <input type="text" id="NAME" name="NAME" required placeholder="enter your username"><br><br>
                
            <label for="EMAIL">EMAIL:</label>
            <input type="email" id="EMAIL" name="EMAIL" required placeholder="Enter your email"><br><br>
                
            <label for="PASSWORD">PASSWORD:</label>
            <input type="password" id="PASSWORD" name="PASSWORD" required placeholder="Enter your password"><br><br>
                
            <button type="submit">LOGIN</button>
               
            <button type="reset">CLEAR</button>
        
        </fieldset>
    </form>
</body>
</html>
