<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
        body {
            background-color: lightblue;
            background-size: cover;
        }
            form {
                background-color: aliceblue;
                background-size: cover;
                border-radius: 10px;
            }
            label {
                display: block;
                margin-bottom: 5px;
            }
            input[type="text"],
            input[type="email"],
            input[type="tel"],
            input[type="date"],
            input[type="number"],
            textarea,select {
                width: 50%;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            input:focus, textarea:focus, select:focus {
                outline: none;
                border-color: #4CAF50;
                box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
            }
            button {
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                transition: background-color 0.3s;
            }
            button:hover {
                background-color: #45a049;
            }
            h1 {
                text-align: center;
                color: #400505;
            }


    </style>
</head>
<body>
        
        <form  align="corner" style="width: 400px; margin: auto;">
            <fieldset style="width: 350px; margin: auto;">
                <legend align="corner"><b>Job Application Form</b></legend> 
                <h1>Job Application Form</h1>
            <label for="name"><b>First Name</b></label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="lastname"><b>Last Name</b></label>
            <input type="text" id="lastname" name="lastname" required><br><br>
            <label for="email"><b>Email</b></label>
            <input type="email" id="email" name="email"  placeholder="enter your email" required><br><br>
            <label for="phone"><b>Phone Number</b></label> 
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required placeholder="+91"><br><br>
            <label for="date"><b>Date of Birth</b></label>
            <input type="date" id="date" name="date" required><br><br>
            <label for="gender"><b>Gender</b></label>
            <input type="radio" id="gender" name="gender" value="male" required><label for="male">Male</label>
            <input type="radio" id="gender" name="gender" value="female" required><label for="female">Female</label><br><br>
            <label for="age"><b>Age</b></label>
            <input type="number" id="age" name="age" required><br><br>
            <label for="state"><b>State</b></label>
            <input type="text" id="state" name="state" required><br><br>
            <label for="city"><b>City</b></label>
            <input type="text" id="city" name="city" required><br><br>
            <label for="address"><b>Address</b></label>
            <textarea rows="4" cols="30" id="address" name="address" required placeholder="enter your address"></textarea><br><br>
            <label for="skills"><b>Skills:</b></label><br><br>
            <input type="range" id="skills" name="skills" min="0" max="100" value="html"><label for="html">HTML</label><br><br>
            <input type="range" id="skills" name="skills" min="0" max="100" value="css"><label for="css">CSS</label><br><br>
            <input type="range" id="skills" name="skills" min="0" max="100" value="javascript"><label for="javascript">JavaScript</label><br><br> 
            <input type="range" id="skills" name="skills" min="0" max="100" value="ci/cd"><label for="ci/cd">CI/CD</label><br><br> 
            <input type="range" id="skills" name="skills" min="0" max="100" value="mongodb"><label for="mongodb">MongoDB</label><br><br> 
            <input type="range" id="skills" name="skills" min="0" max="100" value="app integration testing"><label for="app integration testing">App Integration Testing</label><br><br> 
            <input type="range" id="skills" name="skills" value="api testing"><label for="api testing">API Testing</label><br><br>
            <label for="languages"><b>Languages Known:</b></label><br><br>
            <input type="range" id="languages" name="languages" min="0" max="100" value="english"><label for="english">English</label><br><br>
            <input type="range" id="languages" name="languages" min="0" max="100" value="hindi"><label for="hindi">Hindi</label><br><br>
            <input type="range" id="languages" name="languages" min="0" max="100" value="telugu"><label for="telugu">Telugu</label><br><br>
            <label for="Resume"><b>Resume:</b></label><br></br>
            <input type="file" id="Resume" name="Resume" accept=".pdf,.doc,.docx" required><br><br>
            <button type="submit"><b>Submit</b></button>
            <button type="reset"><b>Reset</b></button>
        </fieldset>
        </form>
</body>
</html>
